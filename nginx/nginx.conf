upstream api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /static/;
        expires 30d;
        access_log off;
    }

    # Rotas da API (e admin/docs) vão para o Django. As telas do front (/entrar, /painel,
    # /prestador, /acompanhar/...) usam outros prefixos de propósito, para não colidir.
    location ~ ^/(auth|chamados|prestadores|fechamentos|rastreio|health|admin|docs|schema)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    root /usr/share/nginx/html;

    # Arquivos do build têm hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Qualquer outra rota é do SPA: o index.html nunca fica em cache, para o deploy chegar na hora.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
