name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # fixo: atualização da imagem não muda o build sem aviso

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: despacha
          POSTGRES_USER: despacha
          POSTGRES_PASSWORD: despacha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U despacha"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key-com-pelo-menos-32-caracteres
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DATABASE_URL: postgis://despacha:despacha@localhost:5432/despacha
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - name: Instalar GDAL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libproj-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos
        run: mypy .

      - name: Migrations em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Schema OpenAPI válido
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Docker Compose válido (com os profiles opcionais)
        # O .env sai logo depois: o Django leria esses valores no passo dos testes.
        run: cp .env.example .env && docker compose --profile rota --profile demo config --quiet && rm .env

      - name: Testes
        run: pytest --cov=apps --cov=core --cov-report=term-missing --cov-fail-under=95

  front:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Tipos
        run: npm run tipos

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Imagem do Nginx (build do front + configuração válida)
        working-directory: .
        # `api` só existe dentro do compose: aqui aponta para o próprio container no teste.
        run: |
          docker build -f nginx/Dockerfile -t despacha-nginx .
          docker run --rm --add-host api:127.0.0.1 despacha-nginx nginx -t
