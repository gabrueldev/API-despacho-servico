x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS: requirements-dev.txt
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: despacha
      POSTGRES_USER: despacha
      POSTGRES_PASSWORD: despacha
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U despacha -d despacha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi -c gunicorn.conf.py"
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"

  # Filas leves e críticas: timeout de aceite e notificações.
  worker:
    <<: *app
    command: celery -A config worker -Q critica,notificacoes -l info --concurrency 4

  # Tarefas longas: fechamento e flush de localização. Uma por vez por processo.
  worker-pesada:
    <<: *app
    command: celery -A config worker -Q pesada -l info --concurrency 2 --prefetch-multiplier 1

  beat:
    <<: *app
    command: celery -A config beat -l info

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  pgdata:
  static:
