x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS: requirements-dev.txt
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: despacha
      POSTGRES_USER: despacha
      POSTGRES_PASSWORD: despacha
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U despacha -d despacha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi -c gunicorn.conf.py"
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"

  # Filas leves e críticas: timeout de aceite e notificações.
  worker:
    <<: *app
    command: celery -A config worker -Q critica,notificacoes -l info --concurrency 4

  # Tarefas longas: fechamento e flush de localização. Uma por vez por processo.
  worker-pesada:
    <<: *app
    command: celery -A config worker -Q pesada -l info --concurrency 2 --prefetch-multiplier 1

  beat:
    <<: *app
    command: celery -A config beat -l info

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  # --- Rota por estrada (opcional) ------------------------------------------------------------
  # docker compose --profile rota up   +   DISTANCIA_PROVEDOR=osrm no .env
  # Na primeira vez baixa o mapa (OSRM_PBF_URL, padrão: Sudeste, ~860 MB) e pré-processa
  # (minutos). Depois fica tudo no volume `osrm` e sobe em segundos. Sem esse profile, a API
  # segue com a distância em linha reta (ou estimada, se DISTANCIA_PROVEDOR=osrm).
  osrm-mapa:
    image: curlimages/curl:8.10.1
    profiles: [rota]
    user: root
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/south-america/brazil/sudeste-latest.osm.pbf}
    volumes:
      - osrm:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /data/regiao.osm.pbf ]; then
          curl -fL --retry 3 -o /data/regiao.osm.pbf.part "$$OSRM_PBF_URL"
          mv /data/regiao.osm.pbf.part /data/regiao.osm.pbf
        fi

  osrm-preparo:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    profiles: [rota]
    volumes:
      - osrm:/data
    depends_on:
      osrm-mapa:
        condition: service_completed_successfully
    # MLD: pré-processamento mais rápido que CH e permite trocar pesos sem refazer tudo.
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /data/regiao.osrm.mldgr ]; then
          osrm-extract -p /opt/car.lua /data/regiao.osm.pbf
          osrm-partition /data/regiao.osrm
          osrm-customize /data/regiao.osrm
        fi

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian
    profiles: [rota]
    command: osrm-routed --algorithm mld /data/regiao.osrm
    volumes:
      - osrm:/data:ro
    depends_on:
      osrm-preparo:
        condition: service_completed_successfully
    expose:
      - "5000"
    restart: unless-stopped

volumes:
  pgdata:
  static:
  osrm:
